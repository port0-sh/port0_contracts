[package]
name = "integration"
version = "0.3.0"
edition.workspace = true
authors.workspace = true

[dependencies]
miden-client = { version = "=0.17.1", features = ["tonic"] }
miden-client-sqlite-store = { version = "=0.17.1", package = "miden-client-sqlite-store" }
miden-standards = { version = "=0.17.1", features = ["testing"] }
miden-testing = "=0.17.1"
miden-mast-package = { version = "=0.35.0", default-features = false }
miden-protocol = "=0.17.1"
miden-tx = "=0.17.1"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
